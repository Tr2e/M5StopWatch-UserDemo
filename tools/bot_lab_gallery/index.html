<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bot Lab — Expression Gallery</title>
  <style>
    :root { color-scheme: dark; --ink:#050505; --panel:#151515; --line:#292929; --text:#f4f1eb; --muted:#888; --bot:#242424; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at 68% 35%,#1d1d1d 0,#0b0b0b 34%,#050505 73%); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,sans-serif; }
    .shell { width:min(1140px,calc(100% - 40px)); margin:auto; padding:44px 0; display:grid; grid-template-columns:285px 1fr; gap:26px; }
    .sidebar,.showcase { background:rgba(17,17,17,.78); border:1px solid var(--line); box-shadow:0 24px 80px #0008; backdrop-filter:blur(20px); }
    .sidebar { border-radius:24px; padding:24px 16px 16px; }
    .eyebrow { color:#9f9f9f; font:600 11px/1.2 ui-monospace,SFMono-Regular,monospace; letter-spacing:.15em; text-transform:uppercase; }
    h1 { font-size:27px; letter-spacing:-.055em; margin:9px 8px 8px; }
    .sub { color:var(--muted); margin:0 8px 22px; font-size:13px; line-height:1.45; }
    .state-list { display:grid; grid-template-columns:1fr 1fr 1fr; gap:7px; }
    button { color:#aaa; text-align:left; border:1px solid transparent; border-radius:12px; padding:10px 11px; background:transparent; cursor:pointer; font:600 11px/1 ui-monospace,SFMono-Regular,monospace; letter-spacing:.02em; transition:.18s ease; }
    button:hover { color:var(--text); background:#242424; }
    button[aria-pressed="true"] { color:var(--text); background:#2b2b2b; border-color:#414141; box-shadow:inset 0 1px #ffffff14; }
    .showcase { min-height:650px; border-radius:28px; padding:30px; display:grid; place-items:center; position:relative; overflow:hidden; }
    .topline { position:absolute; top:30px; left:32px; right:32px; display:flex; align-items:center; justify-content:space-between; }
    #title { margin:6px 0 0; font-size:24px; letter-spacing:-.04em; }
    .counter { color:#888; font:12px ui-monospace,SFMono-Regular,monospace; }
    .hint { position:absolute; bottom:26px; color:#777; font-size:12px; }
    .stage { width:min(420px,70vw); aspect-ratio:1; position:relative; display:grid; place-items:center; }
    .bot { width:208px; height:192px; border-radius:94px; position:relative; background:linear-gradient(180deg,#343434 0 45%,#171717 68%,#111 100%); box-shadow:inset 0 12px 20px #ffffff09,0 20px 42px #0008; animation:breathe 3.4s ease-in-out infinite; transition:width .3s,height .3s; z-index:2; }
    .eye { position:absolute; top:103px; width:23px; height:42px; border-radius:20px; background:var(--text); transform:translateX(-50%); animation:blink 4.1s infinite; transform-origin:center; }
    .left { left:76px; } .right { left:134px; }
    .mouth { opacity:0; position:absolute; width:48px; height:9px; border-radius:10px; background:var(--text); left:80px; top:145px; transition:.2s; }
    .orbit { position:absolute; width:276px; height:276px; border-radius:50%; border:7px solid #2f2f2f; opacity:0; }
    .orbit { border-width:2px; border-color:#f4f1eb70; animation:ring 1s ease-in-out infinite; }
    .progress-meter { position:absolute; inset:0; display:grid; place-items:center; opacity:0; transition:opacity .2s; }
    .progress-meter svg { width:286px; height:286px; transform:rotate(-90deg); overflow:visible; }
    .progress-track { fill:none; stroke:#2f2f2f; stroke-width:7; }
    .progress-value { fill:none; stroke:var(--text); stroke-width:7; stroke-linecap:round; stroke-dasharray:804; stroke-dashoffset:804; animation:fill-progress 3.2s cubic-bezier(.42,0,.24,1) infinite; }
    .progress-number { position:absolute; color:var(--text); font:600 13px ui-monospace,SFMono-Regular,monospace; letter-spacing:.08em; opacity:0; }
    .dots,.sleep-dots,.confetti { position:absolute; inset:0; pointer-events:none; }
    .dots i,.sleep-dots i,.confetti i { position:absolute; display:block; border-radius:50%; }
    .dots i { width:10px;height:10px;background:#a9d6ff; left:calc(50% + 105px); top:calc(50% - 58px); animation:thinking 1.1s infinite alternate; }
    .dots i:nth-child(2){top:50%;animation-delay:.25s}.dots i:nth-child(3){top:calc(50% + 58px);animation-delay:.5s}
    .sleep-dots i { width:12px;height:12px;background:#a9d6ff; left:calc(50% + 100px); top:calc(50% - 56px); animation:float 1.8s infinite ease-in-out; }.sleep-dots i+ i{width:16px;height:16px;left:calc(50% + 124px);top:calc(50% - 88px);animation-delay:.55s}
    .confetti i { width:8px;height:8px; left:50%;top:50%; opacity:0; background:var(--c); animation:confetti 1.5s infinite ease-out; animation-delay:var(--d); }
    .confetti i:nth-child(1){--c:#f4f1eb;--d:.1s;--x:-145px;--y:-100px}.confetti i:nth-child(2){--c:#a9d6ff;--d:.3s;--x:135px;--y:-96px}.confetti i:nth-child(3){--c:#ffcc66;--d:.5s;--x:150px;--y:64px}.confetti i:nth-child(4){--c:#ff8292;--d:.8s;--x:-140px;--y:90px}.confetti i:nth-child(5){--c:#a9d6ff;--d:1s;--x:-18px;--y:-155px}.confetti i:nth-child(6){--c:#ffcc66;--d:.6s;--x:14px;--y:152px}
    .active .bot { animation:breathe 3.4s ease-in-out infinite; }.active .orbit,.active .progress-meter,.active .progress-number,.active .dots,.active .sleep-dots,.active .confetti { opacity:0; }
    .curious .left,.curious .right { transform:translate(8px,-3px); }.listening .bot { transform:translateY(-5px); }.listening .eye { top:95px; }.listening .left{left:84px}.listening .right{left:126px}
    .thinking .dots { opacity:1; }.working .bot { width:200px;height:198px; }.working .eye { top:108px; }.happy .bot { transform:translateY(-5px); }.happy .eye { top:99px; }.happy .mouth,.playful .mouth { opacity:.82; }
    .playful .bot { animation:hop .77s ease-in-out infinite; }.playful .left { left:71px; }.playful .right { left:139px; }.surprised .bot { width:216px; transform:translateY(-8px); }.surprised .eye { top:94px;height:56px; }.surprised .orbit{opacity:1;}
    .sleeping .bot { transform:translateY(5px); }.sleeping .eye{height:7px;width:28px;top:111px}.sleeping .left{left:73px}.sleeping .right{left:131px}.sleeping .sleep-dots{opacity:1}
    .alert .bot,.alerting .bot { animation:shake .12s infinite; }.alert .orbit,.alerting .orbit { opacity:1;border-color:#ff4e5c; border-width:4px; animation:ring .55s infinite; }.celebrate .bot{animation:hop .4s infinite}.celebrate .left{left:68px;top:99px}.celebrate .right{left:140px;top:99px}.celebrate .confetti{opacity:1}.progress .progress-meter,.progress .progress-number{opacity:1}.progress .bot{width:194px;height:184px}.progress .left{left:82px}.progress .right{left:126px}
    .waking .bot,.spawning .bot,.bouncing .bot { animation:hop .8s ease-in-out infinite; }.waking .eye,.spawning .eye { animation:none; height:10px; transform:translateX(-50%) scaleY(.25); animation:open-eyes .8s ease-out infinite; }.searching .orbit,.radar .orbit,.orbit .orbit { opacity:1; border-color:#a9d6ff; animation:spin 2.6s linear infinite; }.loading .orbit,.uploading .orbit,.sending .orbit,.receiving .orbit { opacity:1; border-width:4px; border-top-color:#f4f1eb; border-right-color:#f4f1eb; animation:spin 1.3s linear infinite; }.writing .dots,.dictating .dots,.humming .dots { opacity:1; }.notifying .orbit { opacity:1; border-color:#ffcc66; animation:ring .7s infinite; }.powering-down .bot { animation:power-down 2.1s infinite ease-in-out; }.drowsy .eye,.bored .eye { height:16px; top:112px; }.angry .left,.suspicious .left { transform:translateX(-50%) rotate(-18deg); }.angry .right,.suspicious .right { transform:translateX(-50%) rotate(18deg); }.sad .bot,.shy .bot { transform:translateY(10px); }.sad .eye { top:112px; }.scared .bot { animation:shake .25s infinite; }.laughing .mouth { opacity:1; height:15px; }.proud .bot { transform:translateY(-10px) scale(1.04); }.confused .left { transform:translate(8px,-8px); }.confused .right { transform:translate(-8px,8px); }.excited .bot { animation:hop .45s infinite; }.excited .mouth { opacity:1; }.dragging .bot { transform:translateX(25px); }.tablet .bot,.capsule .bot { border-radius:44px; }.bean .bot { border-radius:80px 110px 80px 110px; }.egg .bot { border-radius:50% 50% 46% 46%; height:212px; }.squircle .bot { border-radius:54px; }.hex .bot { border-radius:34px; clip-path:polygon(25% 0,75% 0,100% 30%,100% 70%,75% 100%,25% 100%,0 70%,0 30%); }.gem .bot { border-radius:42px; clip-path:polygon(50% 0,100% 34%,76% 100%,24% 100%,0 34%); }.crystal .bot { clip-path:polygon(50% 0,89% 24%,100% 72%,50% 100%,0 72%,11% 24%); }.wedge .bot { border-radius:30px; clip-path:polygon(0 18%,100% 0,88% 100%,0 78%); }.shield .bot { clip-path:polygon(8% 0,92% 0,100% 28%,78% 100%,22% 100%,0 28%); }.dome .bot { border-radius:110px 110px 45px 45px; }.arch .bot { border-radius:110px 110px 30px 30px; height:160px; }.cloud .bot { border-radius:90px; }.teardrop .bot { border-radius:110px 110px 110px 35px; transform:rotate(45deg); }.leaf .bot { border-radius:110px 18px 110px 18px; transform:rotate(-24deg); }
    @keyframes breathe {50%{transform:translateY(-5px)}} @keyframes blink {0%,92%,100%{scale:1 1}95%{scale:1 .14}} @keyframes ring {50%{scale:1.06;opacity:.25}} @keyframes spin {to{rotate:360deg}} @keyframes fill-progress {0%{stroke-dashoffset:804}72%,100%{stroke-dashoffset:52}} @keyframes open-eyes {0%{scale:1 .15}70%,100%{scale:1 1}} @keyframes thinking {to{opacity:.25;scale:.65}} @keyframes float {50%{translate:0 -12px;opacity:.35}} @keyframes hop {50%{transform:translateY(-17px) scaleX(1.04)}} @keyframes shake {50%{translate:5px 0}} @keyframes power-down {0%,65%{scale:1;opacity:1}85%,100%{scale:.7 .08;opacity:.25}} @keyframes confetti {10%{opacity:1}100%{translate:var(--x) var(--y) rotate(320deg);opacity:0}}
    @media(max-width:760px){.shell{grid-template-columns:1fr;padding:20px 0}.sidebar{order:2}.showcase{min-height:520px}.state-list{grid-template-columns:repeat(3,1fr)}.stage{width:340px}.topline{top:22px;left:24px;right:24px}}
  </style>
</head>
<body>
  <main class="shell">
    <aside class="sidebar"><div class="eyebrow">Stopwatch companion</div><h1>Bot Lab</h1><p class="sub">Expression studies for the round-screen app. Select a state to preview its animation.</p><nav class="state-list" id="states"></nav></aside>
    <section class="showcase"><div class="topline"><div><div class="eyebrow">Live preview</div><h2 id="title">Idle</h2></div><span class="counter" id="counter">01 / 39</span></div><div class="stage active idle" id="stage"><div class="orbit"></div><div class="progress-meter"><svg viewBox="0 0 286 286" aria-hidden="true"><circle class="progress-track" cx="143" cy="143" r="128"/><circle class="progress-value" cx="143" cy="143" r="128"/></svg></div><span class="progress-number">SYNCING</span><div class="dots"><i></i><i></i><i></i></div><div class="sleep-dots"><i></i><i></i></div><div class="confetti"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="bot"><i class="eye left"></i><i class="eye right"></i><i class="mouth"></i></div></div><div class="hint">Bot Lab · original procedural expression study</div></section>
  </main>
  <script>
    const states=[['sleeping','Sleeping'],['waking','Waking'],['idle','Idle'],['listening','Listening'],['thinking','Thinking'],['searching','Searching'],['working','Working'],['excited','Excited'],['surprised','Surprised'],['suspicious','Suspicious'],['angry','Angry'],['drowsy','Drowsy'],['happy','Happy'],['curious','Curious'],['confused','Confused'],['bored','Bored'],['proud','Proud'],['shy','Shy'],['sad','Sad'],['laughing','Laughing'],['scared','Scared'],['playful','Playful'],['celebrate','Celebrate'],['orbit','Orbit'],['radar','Radar'],['progress','Progress'],['spawning','Spawning'],['humming','Humming'],['loading','Loading'],['dictating','Dictating'],['writing','Writing'],['sending','Sending'],['receiving','Receiving'],['uploading','Uploading'],['notifying','Notifying'],['alerting','Alerting'],['dragging','Dragging'],['bouncing','Bouncing'],['powering-down','Powering Down']];
    const stage=document.querySelector('#stage'),title=document.querySelector('#title'),counter=document.querySelector('#counter'),list=document.querySelector('#states');
    function select(key,label,index){stage.className=`stage active ${key}`;title.textContent=label;counter.textContent=`${String(index+1).padStart(2,'0')} / ${String(states.length).padStart(2,'0')}`;[...list.children].forEach((button,i)=>button.setAttribute('aria-pressed',String(i===index)));}
    states.forEach(([key,label],index)=>{const button=document.createElement('button');button.textContent=label;button.setAttribute('aria-pressed',String(index===0));button.onclick=()=>select(key,label,index);list.append(button);});
  </script>
</body>
</html>
